[advisories]
version = 2
yanked = "deny"
# Leptos 0.8 transitively uses these crates. Both advisories report maintenance
# status, not a known exploit, and currently have no safe compatible upgrade.
ignore = [
    "RUSTSEC-2024-0436", # paste, through Leptos/either_of
    "RUSTSEC-2026-0173", # proc-macro-error2, through leptos_macro/rstml
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
