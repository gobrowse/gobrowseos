name: gobrowse-os

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    command: ["serve"]
    ports:
      - "127.0.0.1:${GOBROWSE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.75"
    networks:
      - edge
      - data

  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gobrowse}
      POSTGRES_USER: ${POSTGRES_USER:-gobrowse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 4s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"
    networks:
      - data

volumes:
  postgres-data:

networks:
  edge:
  data:
    internal: true
