[workspace]
resolver = "2"
members = [
    "crates/gobrowse-core",
    "crates/gobrowse-sandboxd",
    "crates/gobrowse-server",
    "crates/gobrowse-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/gobrowse-os/gobrowse-os"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.4", features = ["http1", "json", "macros", "tokio", "ws"] }
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.5.47", features = ["derive", "env"] }
config = { version = "0.15.17", default-features = false, features = ["toml"] }
futures-util = "0.3.31"
http = "1.3.1"
leptos = { version = "0.8.9", default-features = false, features = ["csr"] }
pgvector = { version = "0.4.1", features = ["sqlx"] }
rand = "0.9.2"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17.14"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "time", "json"] }
subtle = "2.6.1"
thiserror = "2.0.16"
time = { version = "0.3.43", features = ["serde", "serde-human-readable", "formatting", "parsing"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "process", "io-util", "fs"] }
tokio-util = "0.7.16"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "compression-gzip", "fs", "limit", "request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v7"] }
zeroize = "1.8.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
