[http]
bind = "0.0.0.0:8080"
public_origin = "http://localhost:8080"
secure_cookies = false
static_dir = "dist"
request_body_limit_bytes = 2097152

[database]
url = "postgres://gobrowse:replace-me@localhost:5432/gobrowse"
max_connections = 20

[auth]
session_idle_minutes = 120
session_absolute_hours = 336
argon2_memory_kib = 19456
argon2_iterations = 2
argon2_parallelism = 1
max_parallel_hashes = 4

[vault]
# Configure exactly one source before storing provider credentials. The value is
# standard-base64-encoded 32 random bytes. A root-readable file is preferred.
# master_key_file = "/run/secrets/gobrowse_vault_key"
# master_key_base64 = "development-only-example"
key_version = 1
# During rotation, configure the immediately previous key until all rows are
# rewrapped, then remove it.
# previous_master_key_file = "/run/secrets/gobrowse_vault_key_previous"
# previous_key_version = 1

[features]
sandbox = false
browser = false
messaging = false
voice = false
media = false
lsp = false
otel = false
local_embeddings = false
local_models = false
# When sandbox = true, wire a SandboxClient into the app when both are set:
# sandbox_socket_path = "/tmp/gbsbx/sandboxd.sock"
# sandbox_auth_token = "must match sandboxd --auth-token-file"
# sandbox_socket_timeout_seconds = 30
# sandbox_plugin_image = "localhost/gobrowse-workspace:v1"
# Root directory for plugin artifacts + staging areas (created at startup):
# plugins_dir = "./data/plugins"
# Plugin source test overrides (normally unset -> api.github.com /
# raw.githubusercontent.com). The optional GITHUB_TOKEN env var raises GitHub
# API rate limits for plugin preview/install/search; it is never required.
# github_api_base_url = "https://api.github.com"
# github_raw_base_url = "https://raw.githubusercontent.com"

[observability]
json_logs = false
log_filter = "gobrowse=info,tower_http=info"
